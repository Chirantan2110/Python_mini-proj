<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thinking of You</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #e91e63; /* A nice pink/red color */
            margin-bottom: 20px;
        }

        p {
            line-height: 1.6;
            color: #555;
            margin-bottom: 15px;
        }

        .heart {
            font-size: 40px;
            color: #ff69b4; /* Hot pink */
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.2);
            }
        }

        .message-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #ffebee; /* Light pink background */
            border: 1px solid #fcc;
            border-radius: 5px;
            color: #d81b60; /* Darker pink text */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thinking of You</h1>
        <div class="heart">❤️</div>
        <p>Just wanted to send a little something your way.</p>
        <p>Hope you're having a wonderful day!</p>

        <div class="message-box">
            Maybe someday we could [insert a casual suggestion, e.g., grab a coffee, chat more, etc.]? 😊
        </div>
    </div>
</body>
</html>
