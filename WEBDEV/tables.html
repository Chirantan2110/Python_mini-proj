<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    /* General Styles */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #fff;
    color: #333;
    padding: 2rem;
}

/* Heading */
h1 {
    text-align: center;
    color: #e23744;
    margin-bottom: 2rem;
}

/* Table Styles */
table {
    width: 60%;
    margin: 0 auto;
    border-collapse: collapse;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

thead {
    background-color: #e23744;
    color: #fff;
}

th, td {
    padding: 1rem;
    text-align: center;
    border: 1px solid #ddd;
    font-size: 1rem;
}

tbody tr:nth-child(even) {
    background-color: #f9f9f9;
}

tbody tr:hover {
    background-color: #ffe5e7;
    cursor: pointer;
}

</style>
</head>

<body>
    <h1>tables in html</h1>
    <table>
        <thead>
            <tr>
                <th>name</th>
                <th>roll</th>

            </tr>
        </thead>
        <tbody>
            <tr>
                <td>rick</td>
                <td>256</td>
            </tr>
            <tr>
                <td>raj</td>
                <td>255</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
